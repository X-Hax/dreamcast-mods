Name=Amy Hammer Range Fix
Author=Sora, Woofmute
Version=1.0
Description=Corrects a broken check in Amy's code for determining the range to use for her hammer attacks. The long hammer now actually has a longer range than the regular hammer! ..or rather, the regular hammer now has a shorter range than it used to.\n\nBy default the check in code is bugged, and both Amy's regular hammer and long hammer get the same attack range of 9.0 which is intended for only the long hammer. This patch corrects the comparison so that Amy's regular hammer has the intended range of 7.5, while the long hammer keeps the longer range of 9.0.\n\nThe bug was discovered by Sora, and the DC patch to fix it was made by Woofmute.
GameVersions=MK-51000  V1.00519991005

